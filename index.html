<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
  <title>Seita Inc.</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0707; overflow: hidden; }
    /* o jogo ocupa a janela inteira; a interface interna mantém a proporção 16:9 sozinha */
    #unity-container { position: fixed; inset: 0; }
    #unity-canvas { display: block; width: 100%; height: 100%; background: #0b0707; outline: none; }
    #carregando {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #0b0707; color: #e6c88a; font-family: Georgia, 'Times New Roman', serif; transition: opacity .4s;
    }
    #carregando h1 { font-size: clamp(28px, 6vw, 56px); letter-spacing: .12em; margin: 0 0 24px; text-shadow: 0 0 18px #7a1c1c; }
    #barra { width: min(420px, 70vw); height: 10px; border: 1px solid #7a4a2a; background: #170b0a; }
    #progresso { height: 100%; width: 0; background: linear-gradient(90deg, #c23a24, #e8782a); }
    #dica { margin-top: 14px; font-size: 14px; color: #a58a63; }
    #tela-cheia {
      position: absolute; right: 10px; bottom: 10px; width: 36px; height: 36px; border: 1px solid #7a4a2a; border-radius: 6px;
      background: rgba(23, 11, 10, .7); color: #e6c88a; font-size: 20px; line-height: 1; cursor: pointer; opacity: .55;
    }
    #tela-cheia:hover { opacity: 1; }
    #erro { position: absolute; left: 0; right: 0; top: 0; z-index: 5; display: none; padding: 10px; background: #7a1c1c; color: #fff; font: 14px sans-serif; }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="carregando">
      <h1>SEITA INC.</h1>
      <div id="barra"><div id="progresso"></div></div>
      <div id="dica">carregando o culto...</div>
    </div>
    <button id="tela-cheia" title="Tela cheia" aria-label="Tela cheia">&#x26F6;</button>
    <div id="erro"></div>
  </div>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/out.loader.js";

    function mostrarErro(msg) {
      var e = document.querySelector("#erro");
      e.style.display = "block";
      e.textContent = msg;
    }

    var config = {
      arguments: [],
      dataUrl: buildUrl + "/out.data",
      frameworkUrl: buildUrl + "/out.framework.js",
      codeUrl: buildUrl + "/out.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "SeitaInc",
      productName: "Seita Inc",
      productVersion: "0.1.0",
      fullscreenElementID: "unity-container",
      // telas de alta densidade (retina/4K): limita a resolução interna a 2x para não pesar na GPU
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      // grava em disco (IndexedDB) tudo o que o jogo salva em Application.persistentDataPath
      autoSyncPersistentDataPath: true,
      showBanner: function (msg, type) { if (type === "error") mostrarErro(msg); else console.warn(msg); }
    };

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      var carregando = document.querySelector("#carregando");
      var progresso = document.querySelector("#progresso");
      createUnityInstance(canvas, config, function (p) {
        progresso.style.width = (100 * p) + "%";
      }).then(function (unityInstance) {
        carregando.style.opacity = "0";
        setTimeout(function () { carregando.style.display = "none"; }, 450);
        document.querySelector("#tela-cheia").onclick = function () { unityInstance.SetFullscreen(1); };
      }).catch(function (message) {
        mostrarErro(String(message));
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
